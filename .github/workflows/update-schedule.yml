name: Update DESCO Schedule

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies and Playwright
        run: |
          pip install requests beautifulsoup4 pdfplumber playwright deep-translator
          playwright install chromium

      - name: Run Extraction Engine
        run: |
          cd ingestion
          python fetch_schedule.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Ondhokar Bot"
          git config --global user.email "bot@ondhokar.com"
          git add data/desco-database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: auto-update schedule via Playwright" && git push)
          
      - name: Trigger Vercel Deployment
        if: success()
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_FlHzXbTGbtQcEwUig7VWQRps8s3C/x6FtjRaznS"