name: Update DESCO Schedule

on:
  schedule:
    # Runs at 06:00 UTC, which is exactly 12:00 PM (Noon) Bangladesh Time
    - cron: '0 6 * * *'
  # This specific line creates the manual "Run Workflow" button in GitHub!
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pdfplumber

      - name: Run Extraction Engine
        run: |
          cd ingestion
          python fetch_schedule.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Ondhokar Bot"
          git config --global user.email "bot@ondhokar.com"
          git add data/desco-database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: auto-update DESCO schedule" && git push)