name: Update DESCO Schedule

on:
  schedule:
    # Runs at 6:00 AM Bangladesh time every day (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pdfplumber

      - name: Run Extraction Engine
        run: |
          cd ingestion
          python fetch_schedule.py

      - name: Commit and push changes if data updated
        run: |
          git config --global user.name "Ondhokar Bot"
          git config --global user.email "bot@ondhokar.com"
          git add data/desco-database.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "data: auto-update DESCO schedule" && git push)